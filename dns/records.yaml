# DNS source of truth for Mafrick & Company Advocates website
#
# This file is the canonical expectation for what DNS should look like for
# the custom domain mafrick-munene-advocates.com. It is consumed by
# scripts/check_dns.py from the site-health workflow to compare expected
# vs live records.
#
# The domain mafrick-munene-advocates.com is now configured to serve via
# GitHub Pages (lglenz.github.io). DNS points to GitHub's servers via CNAME.
#
# Status: As of 2026-06-04 the domain is being migrated to GitHub Pages.
# DNS propagation and GitHub Pages TLS issuance for the host are in progress.
# The site-health workflow surfaces drift as a warning (warn-only) until the
# host is verified working end-to-end.

domain: mafrick-munene-advocates.com

records:
  # The custom domain should be a CNAME to GitHub Pages.
  # GitHub's docs for project Pages with a subdomain custom domain:
  # https://docs.github.com/pages/configuring-a-custom-domain-for-your-github-pages-site/managing-a-custom-domain-for-your-github-pages-site#configuring-a-subdomain
  - name: "@"
    type: CNAME
    expected:
      - lglenz.github.io.
    notes: >
      mafrick-munene-advocates.com → lglenz.github.io. (GitHub Pages).
      Update this in your Hetzner/Konsoleh DNS console.

# How site-health uses this file:
#   - For each record, look up the live value via `dig +short`.
#   - For `expected`: live set must equal expected set (order-independent).
#   - For `expected_contains`: at least one live value must contain each
#     listed substring.
#   - Drift is reported. While DNS is being provisioned, drift is warn-only
#     (see site-health.yml).
